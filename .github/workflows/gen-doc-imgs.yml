# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
  push:
    branches: [ main ]
  schedule:
    - cron: 0 0 * * 0 # At 00:00 on Sunday.

permissions:
  contents: write
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Ubuntu 24.04 (AppArmor) only allows the user namespaces needed by Chrome's sandbox
      # for the apt-installed Chrome, not for Chrome for Testing ("No usable sandbox!")
      - name: Allow Chrome sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      # Branded Google Chrome ignores --load-extension since v137, Chrome for Testing does not
      - name: Install Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true
      - name: Build Extension
        run: |
          npm ci --legacy-peer-deps
          npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Install Python Dependencies
        run: |
          cd browser_control
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Gen-Images Python Script
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          cd browser_control
          sudo apt-get install xvfb
          xvfb-run --auto-servernum python gen_docs_images.py
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@28fa4848947e0faa7fa50647691d01477589d5e9
        with:
          commit-message: Regenerate Documentation Images
          committer: MachineDoingStuffByItself <machineaccount@mweiss.com>
          branch: gen-doc-imgs
          title: '[Bot] Regenerate Documentation Images'
          body: |
            Regenerate Documentation Images
            - Ran `python gen_docs_images.py`
            - Pull request created by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
